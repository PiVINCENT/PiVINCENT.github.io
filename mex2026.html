          J'ai participé au <strong>27ème Open International de Meximieux</strong> qui s'est déroulé le 23, 24 et 25 mai 2026. Il s'agit du tournoi le plus relevé du département de l'Ain, avec 12 joueurs au dessus de 2000 elo et trois joueurs titrés. Le tournoi se joue en 7 parties lentes avec 1h30+30 secondes par coup. Visant les 15 première places au début du tournoi, je finis <strong>2ème</strong> du classement gnénéral avec <strong>6 points sur 7</strong> et en ayant subi aucune défaite. J'ai notamment battu le <strong>FM Guillaume GARDE</strong> (2169 elo), l'entraineur <strong>Bardhyl BISLIMI</strong> (2086) et fait partie nulle contre le vainqueur du tournoi <strong>Albert AROUSSTAMIAN</strong> (2029).<br>
          <br>
          ← Au centre, Albert AROUSSTAMIAN, à droite, Pierre VINCENT (moi même).<br>
        </div>

      <div id="rubriques-titre">
          ♟️ 1. Pierre VINCENT (1879) vs. Elias PAPADOPOULOS (1562) 	
      </div>
      Commentaire : je joue contre un jeune joueur de Lyon Olympique Echecs. Je suis prudent car les jeunes de LOE ont souvent un elo bien inférieur à leur niveau réel. Il remportera d'ailleurs le prix -18 ans. Il joue très vite les premiers coups, ce qui me permet de prendre l'avantage grâce à mon fort centre de pion. Après son 21ème coup, je comprends qu'il a des pièces très actives et que ma structure de pions avancée affablit les cases de mon camp. Cependant, il commet une grave erreur au 24ème, en me permettant de replacer mon cavalier en h4 avec tempo sur sa dame et de combattre le surplus de pièces noires à l'aile dame. Je conclut quelques coups plus tard grâce à l'anvancé de mes pions centraux.  <br>
      <br>
      <div id="rubriques-titre">
          ♟️ 2. FM Guillaume GARDE (2169) vs. Pierre VINCENT (1879) 
      </div>
      Commentaire : comme je suis dans la deuxième partie du tableau, je suis appareillé avec les noirs contre FM Guillaume GARDE à la deuxième ronde. C'est un jeune joueur de 17 ans, récemment titré et qui est monté à 2287 elo. Je joue une défense Alekhine qui tourne très mal. En effet, au dixième coup, j'ai joué e5, que j'avais déjà tenté en partie rapide avec succès. Mon adversaire a parfaitement répondu avec Fg5 et 5 coups plus tard, je comprends que ma position est très mauvaise. Mes pièces ne sont pas développés et je vais devoir les bouger plusieurs fois pour mobiliser le reste de mes pièces. Pendant ce temps, mon adversaire a le champs libre pour me mettre en difficulté, notamment en positionnant un cavalier en d6, ce qui arrivera au 19ème. La partie continue et je parviens à trouver du jeu en jouant a5 et en doublant mes tours sur la colonne a, ce qui est un plan typique des mauvaises positions de la défense Alekhine. Ma position reste délicate mais mon adversaire prend beaucoup de temps. Le tournant arrive au 34ème coup lorsque je joue Tb4 et que je comprends qu'après 35. Dc2 Cxe3 et 36. Dd2 il y a probablement un chemin pour m'en sortir et faire partie nulle. Je réfélchis 20 mins pour jouer me décider du coup 36... Txd4. Bien que ce coup était mauvais, mon adversaire réagit très mal et je me retrouve dans une position gagnante qui me mène dans une finale de tour avec trois pions de plus et que je réussis à convertir au 84ème coups.<br>
